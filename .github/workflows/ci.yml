name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Report dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); const counts = report.metadata?.vulnerabilities || {}; console.log('Dependency audit:', JSON.stringify(counts)); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ': ' + item.severity + '; direct=' + item.isDirect + '; range=' + item.range + '; fix=' + JSON.stringify(item.fixAvailable));"
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "const report = require('./npm-audit-production.json'); console.log('Production dependency audit:', JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log('PRODUCTION ' + name + ': ' + item.severity + '; direct=' + item.isDirect + '; range=' + item.range + '; fix=' + JSON.stringify(item.fixAvailable));"

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
