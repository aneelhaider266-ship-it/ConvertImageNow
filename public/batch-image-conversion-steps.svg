<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Four steps to batch convert images</title><desc id="desc">Select several images, choose an output format, convert in the browser, and download the results.</desc><rect width="1200" height="675" rx="32" fill="#101B33"/><text x="72" y="96" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Batch convert images in four steps</text><text x="72" y="140" fill="#b8c8df" font-family="Arial,sans-serif" font-size="22">A simple workflow for handling multiple files</text><g font-family="Arial,sans-serif"><g transform="translate(72 220)"><rect width="240" height="280" rx="22" fill="#172642" stroke="#405777"/><circle cx="120" cy="76" r="42" fill="#398BFF" opacity=".22"/><path d="M120 49v54m-27-27h54" stroke="#8ec5ff" stroke-width="9" stroke-linecap="round"/><text x="120" y="164" text-anchor="middle" fill="#8ec5ff" font-size="22" font-weight="700">01</text><text x="120" y="205" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Select files</text><text x="120" y="242" text-anchor="middle" fill="#b8c8df" font-size="17">Add multiple images</text></g><g transform="translate(348 220)"><rect width="240" height="280" rx="22" fill="#172642" stroke="#405777"/><circle cx="120" cy="76" r="42" fill="#398BFF" opacity=".22"/><path d="M92 61h56m-56 30h56" stroke="#8ec5ff" stroke-width="8" stroke-linecap="round"/><text x="120" y="164" text-anchor="middle" fill="#8ec5ff" font-size="22" font-weight="700">02</text><text x="120" y="205" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Choose output</text><text x="120" y="242" text-anchor="middle" fill="#b8c8df" font-size="17">Pick a supported format</text></g><g transform="translate(624 220)"><rect width="240" height="280" rx="22" fill="#172642" stroke="#405777"/><circle cx="120" cy="76" r="42" fill="#398BFF" opacity=".22"/><path d="M96 78l17 17 33-39" fill="none" stroke="#8ec5ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="164" text-anchor="middle" fill="#8ec5ff" font-size="22" font-weight="700">03</text><text x="120" y="205" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Convert locally</text><text x="120" y="242" text-anchor="middle" fill="#b8c8df" font-size="17">Browser processes files</text></g><g transform="translate(900 220)"><rect width="240" height="280" rx="22" fill="#172642" stroke="#405777"/><circle cx="120" cy="76" r="42" fill="#398BFF" opacity=".22"/><path d="M120 48v58m-23-22l23 23 23-23" fill="none" stroke="#8ec5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="164" text-anchor="middle" fill="#8ec5ff" font-size="22" font-weight="700">04</text><text x="120" y="205" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Download</text><text x="120" y="242" text-anchor="middle" fill="#b8c8df" font-size="17">Save files or ZIP archive</text></g></g><text x="72" y="590" fill="#8fa6c4" font-family="Arial,sans-serif" font-size="17">Available formats and ZIP export depend on the selected tool and browser support.</text></svg>