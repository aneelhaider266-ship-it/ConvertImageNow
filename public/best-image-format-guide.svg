<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Choose an image format by image type</title><desc id="desc">A guide matching photographs, screenshots, logos and animation to suitable image formats.</desc><rect width="1200" height="675" rx="32" fill="#101B33"/><text x="72" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Choose a format by image type</text><text x="72" y="132" fill="#b8c8df" font-family="Arial,sans-serif" font-size="21">A practical starting point for common website assets</text><g font-family="Arial,sans-serif"><g transform="translate(72 190)"><rect width="500" height="170" rx="22" fill="#172642" stroke="#405777"/><circle cx="82" cy="82" r="42" fill="#398BFF" opacity=".22"/><path d="M52 103l25-34 18 21 15-15 26 28" fill="none" stroke="#75b5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="62" fill="#fff" font-size="27" font-weight="700">Photographs</text><text x="160" y="103" fill="#8ec5ff" font-size="24">WebP or JPEG</text><text x="160" y="135" fill="#b8c8df" font-size="17">Compare quality and output size</text></g><g transform="translate(628 190)"><rect width="500" height="170" rx="22" fill="#172642" stroke="#405777"/><rect x="48" y="48" width="72" height="72" rx="12" fill="none" stroke="#75b5ff" stroke-width="7" stroke-dasharray="9 7"/><text x="160" y="62" fill="#fff" font-size="27" font-weight="700">Logos &amp; icons</text><text x="160" y="103" fill="#8ec5ff" font-size="24">SVG or PNG</text><text x="160" y="135" fill="#b8c8df" font-size="17">Use vector artwork when available</text></g><g transform="translate(72 390)"><rect width="500" height="170" rx="22" fill="#172642" stroke="#405777"/><rect x="48" y="45" width="78" height="78" rx="8" fill="#253b5c" stroke="#75b5ff" stroke-width="4"/><path d="M58 108l20-23 15 14 12-18 13 27" fill="none" stroke="#75b5ff" stroke-width="5"/><text x="160" y="62" fill="#fff" font-size="27" font-weight="700">Screenshots &amp; text</text><text x="160" y="103" fill="#8ec5ff" font-size="24">PNG or lossless WebP</text><text x="160" y="135" fill="#b8c8df" font-size="17">Keep edges and small lettering crisp</text></g><g transform="translate(628 390)"><rect width="500" height="170" rx="22" fill="#172642" stroke="#405777"/><circle cx="88" cy="84" r="39" fill="none" stroke="#75b5ff" stroke-width="7"/><path d="M78 62l30 22-30 22z" fill="#75b5ff"/><text x="160" y="62" fill="#fff" font-size="27" font-weight="700">Animation</text><text x="160" y="103" fill="#8ec5ff" font-size="24">Animated WebP or video</text><text x="160" y="135" fill="#b8c8df" font-size="17">Choose based on duration and platform</text></g></g><text x="72" y="625" fill="#8fa6c4" font-family="Arial,sans-serif" font-size="16">The best choice depends on transparency, compatibility, quality and the destination.</text></svg>