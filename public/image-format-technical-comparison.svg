<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Technical comparison of JPG PNG WebP and AVIF</title><desc id="desc">Comparison of compression, transparency and animation support for four common image formats.</desc><rect width="1200" height="675" rx="32" fill="#101B33"/><text x="72" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Image format technical comparison</text><text x="72" y="132" fill="#b8c8df" font-family="Arial,sans-serif" font-size="21">Check the properties that affect your workflow</text><g font-family="Arial,sans-serif" font-size="23"><rect x="72" y="178" width="1056" height="62" rx="12" fill="#253b5c"/><text x="112" y="218" fill="#fff" font-weight="700">Format</text><text x="380" y="218" fill="#fff" font-weight="700">Compression</text><text x="650" y="218" fill="#fff" font-weight="700">Transparency</text><text x="900" y="218" fill="#fff" font-weight="700">Animation</text><g fill="#e8f1ff"><rect x="72" y="250" width="1056" height="76" rx="10" fill="#172642"/><text x="112" y="297" fill="#fff" font-weight="700">JPG</text><text x="380" y="297">Lossy</text><text x="650" y="297">No</text><text x="900" y="297">No</text><rect x="72" y="336" width="1056" height="76" rx="10" fill="#172642"/><text x="112" y="383" fill="#fff" font-weight="700">PNG</text><text x="380" y="383">Lossless</text><text x="650" y="383">Yes</text><text x="900" y="383">APNG variant</text><rect x="72" y="422" width="1056" height="76" rx="10" fill="#172642"/><text x="112" y="469" fill="#fff" font-weight="700">WebP</text><text x="380" y="469">Lossy / lossless</text><text x="650" y="469">Yes</text><text x="900" y="469">Yes</text><rect x="72" y="508" width="1056" height="76" rx="10" fill="#172642"/><text x="112" y="555" fill="#fff" font-weight="700">AVIF</text><text x="380" y="555">Lossy / lossless</text><text x="650" y="555">Yes</text><text x="900" y="555">Yes</text></g></g><text x="72" y="630" fill="#8fa6c4" font-family="Arial,sans-serif" font-size="16">File size and visual quality vary by source image, encoder and settings. Test real exports.</text></svg>