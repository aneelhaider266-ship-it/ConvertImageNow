<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Image SEO checklist</title><desc id="desc">Four image optimization checks: descriptive filenames, useful alt text, correct dimensions and efficient formats.</desc><rect width="1200" height="675" rx="32" fill="#101B33"/><text x="72" y="100" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Image SEO checklist</text><text x="72" y="146" fill="#b8c8df" font-family="Arial,sans-serif" font-size="22">Make every image easier to understand and faster to use</text><g font-family="Arial,sans-serif"><g transform="translate(88 220)"><circle cx="34" cy="35" r="28" fill="#398BFF" opacity=".25"/><path d="M20 35l10 10 20-23" fill="none" stroke="#8ec5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="30" fill="#fff" font-size="28" font-weight="700">Descriptive file names</text><text x="92" y="67" fill="#b8c8df" font-size="20">Use clear names that describe the actual image.</text></g><g transform="translate(88 315)"><circle cx="34" cy="35" r="28" fill="#398BFF" opacity=".25"/><path d="M20 35l10 10 20-23" fill="none" stroke="#8ec5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="30" fill="#fff" font-size="28" font-weight="700">Useful alternative text</text><text x="92" y="67" fill="#b8c8df" font-size="20">Describe the image's purpose, not a keyword list.</text></g><g transform="translate(88 410)"><circle cx="34" cy="35" r="28" fill="#398BFF" opacity=".25"/><path d="M20 35l10 10 20-23" fill="none" stroke="#8ec5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="30" fill="#fff" font-size="28" font-weight="700">Appropriate dimensions</text><text x="92" y="67" fill="#b8c8df" font-size="20">Serve an image close to its displayed size.</text></g><g transform="translate(88 505)"><circle cx="34" cy="35" r="28" fill="#398BFF" opacity=".25"/><path d="M20 35l10 10 20-23" fill="none" stroke="#8ec5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="30" fill="#fff" font-size="28" font-weight="700">Efficient image formats</text><text x="92" y="67" fill="#b8c8df" font-size="20">Balance file size, visual quality and compatibility.</text></g></g></svg>